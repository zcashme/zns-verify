[package]
name = "zns-verify"
version = "0.0.2"
edition = "2021"
description = "ZcashName (ZNS) hash, action, and memo primitives -- used by Registry minters and Resolvers"
license = "MIT"
repository = "https://github.com/zcashme/zns-verify"
homepage = "https://github.com/zcashme/zns-verify"
keywords = ["zcash", "zns", "orchard", "verification", "names"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[features]
# Default is the pure verification kernel: no_std, no orchard, pasta/sinsemilla
# math only -- droppable into a wallet, SDK, enclave, or embedded target.
default = []

# `decrypt` adds relaxed Ironwood trial decryption (skips the ZIP-212 cmx check)
# for scanning Name Notes. Name Notes are Ironwood-pool notes (NU6.3), so this
# uses IronwoodDomain, not OrchardDomain. It pulls orchard + the cipher
# primitives and forces std, so it is strictly opt-in -- anyone who only needs
# to *verify* a binding never compiles it.
decrypt = [
    "dep:orchard",
    "dep:zcash_note_encryption",
    "dep:zcash_protocol",
    "dep:chacha20",
    "dep:chacha20poly1305",
]

[dependencies]
blake2b_simd = { version = "1", default-features = false }
pasta_curves = { version = "0.5", default-features = false }

# For computing the expected Sinsemilla note commitment from the
# caller-supplied (g_d, pk_d, v, ρ, ψ, rcm) -- entirely from crates.io,
# no orchard fork required.
sinsemilla = "0.1"
group = { version = "0.13", default-features = false }

# ── `decrypt` (relaxed Ironwood trial decrypt, optional) ────────────────────
# Re-implements zcash_note_encryption's inner decrypt to skip the ZIP-212 cmx
# check. Name Notes are Ironwood-pool notes (ZIP 2005, NU6.3): they carry V3
# note plaintexts (lead byte 0x03) and require the Ironwood note-encryption
# domain, not OrchardDomain. The cipher crates are pinned to the same versions
# zcash_note_encryption 0.4.2 uses internally, so the keystream / AEAD behaviour
# matches byte-for-byte.
orchard = { version = "0.15.5", default-features = false, features = ["std"], optional = true }
zcash_note_encryption = { version = "0.4.2", optional = true }
zcash_protocol = { version = "0.10", default-features = false, features = ["std"], optional = true }
chacha20 = { version = "0.9", default-features = false, optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
hex = "0.4"
hex-literal = "0.4"

# Same local orchard as seer-sync / zns-resolver when this crate is the root.
[patch.crates-io]
# Git tag of the last commit whose package name is `orchard` (pre-rename).
orchard = { git = "https://github.com/zcashme/orchard.git", tag = "zns-orchard-v0.15.5" }
